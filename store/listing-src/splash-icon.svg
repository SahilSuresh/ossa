<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <!-- Ossa splash icon, 1024x1024, 22 Oct 2026.
       Centred hex rank mark + OSSA wordmark on a near-black field with a faint lime radial glow.
       Hex geometry matches tokens.css's --hex (flat-top polygon) at aspect 1:0.866.
       Render via: node store/listing-src/render-icon.js store/listing-src/splash-icon.svg assets/
       Then move assets/splash-icon-1024.png over assets/splash-icon.png. -->
  <defs>
    <!-- a faint lime glow behind the mark; sits over black so it reads as a soft halo rather than a stripe -->
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#D4FF00" stop-opacity="0.14"/>
      <stop offset="35%" stop-color="#D4FF00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- a two-stop lime gradient on the hex face, so it reads sculpted on the home screen too -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8FF66"/>
      <stop offset="55%" stop-color="#D4FF00"/>
      <stop offset="100%" stop-color="#9AB800"/>
    </linearGradient>
    <!-- a subtler inner highlight for depth -->
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="4" result="shadow"/>
      <feFlood flood-color="#D4FF00" flood-opacity="0.35"/>
      <feComposite in2="shadow" operator="in" result="colouredShadow"/>
      <feMerge>
        <feMergeNode in="colouredShadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- the field -->
  <rect width="1024" height="1024" fill="#000000"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- the hex rank mark, centred at (512, 468), width 420, aspect 0.866 so height ~ 364. The polygon follows the
       app's --hex flat-top shape. -->
  <g filter="url(#markGlow)">
    <!-- outer hex face -->
    <polygon points="512,286 722,377 722,559 512,650 302,559 302,377" fill="url(#face)"/>
    <!-- inner highlight ring -->
    <polygon points="512,312 696,392 696,544 512,624 328,544 328,392" fill="url(#inner)"/>
    <!-- inner line, for the "rank badge" look that matches ranks.js's hexagons in the app -->
    <polygon points="512,344 668,412 668,524 512,592 356,524 356,412" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="4"/>
  </g>

  <!-- OSSA wordmark. SF Pro Display Black on iOS; falls back to system fonts in the headless render. -->
  <text x="512" y="810" fill="#F6FDD7" text-anchor="middle"
    font-family="system-ui, -apple-system, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Arial"
    font-size="156" font-weight="900" letter-spacing="18">OSSA</text>

  <!-- hairline underscore, in the glow colour, to lock the word to the mark above -->
  <rect x="432" y="862" width="160" height="4" rx="2" fill="#D4FF00" opacity="0.85"/>
</svg>
