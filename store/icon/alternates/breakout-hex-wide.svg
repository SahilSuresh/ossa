<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="512" cy="470" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161617"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="202" x2="0" y2="822" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#77746F"/><stop offset=".45" stop-color="#4A4845"/><stop offset="1" stop-color="#2E2D2B"/>
    </linearGradient>
    <filter id="bloom" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1424" height="1424"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="tip" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1424" height="1424"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="spill" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1424" height="1424"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1424" height="1424"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="core" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1424" height="1424"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="drop" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1424" height="1424"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="grain" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1424" height="1424">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="11"/><feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="cL"><polygon points="512,202 528,300 540,398 524,500 530,604 506,712 512,822 202,667 202,357"/></clipPath>
    <clipPath id="cR"><polygon points="512,202 822,357 822,667 512,822 506,712 530,604 524,500 540,398 528,300"/></clipPath>
    <clipPath id="sL"><polygon points="478,-50 478,202 494,300 506,398 490,500 496,604 472,712 478,822 478,1100 -50,1100 -50,-50"/></clipPath>
    <clipPath id="sR"><polygon points="546,-50 546,193 562,291 574,389 558,491 564,595 540,703 546,813 546,1100 1100,1100 1100,-50"/></clipPath>
    <clipPath id="gp"><polygon points="546,193 562,291 574,389 558,491 564,595 540,703 546,813 478,822 472,712 496,604 490,500 506,398 494,300 478,202"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- shadow and slab thickness, each slab cut along its own half's edge -->
    <polygon points="478,228 494,326 506,424 490,526 496,630 472,738 478,848 168,693 168,383" fill="#000" opacity=".8" filter="url(#drop)"/>
    <polygon points="546,219 856,374 856,684 546,839 540,729 564,621 558,517 574,415 562,317" fill="#000" opacity=".8" filter="url(#drop)"/>
    <g clip-path="url(#sL)"><polygon points="478,220 494,318 506,416 490,518 496,622 472,730 478,840 168,685 168,375" fill="#18181A"/></g>
    <g clip-path="url(#sR)"><polygon points="546,211 856,366 856,676 546,831 540,721 564,613 558,509 574,407 562,309" fill="#18181A"/></g>
    <!-- the light coming out: bloom along the split and past both points -->
    <path d="M512 197.5 L528 295.5 L540 393.5 L524 495.5 L530 599.5 L506 707.5 L512 817.5" fill="none" stroke="#D4FF00" stroke-width="150" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#bloom)"/>
    <ellipse cx="512" cy="201.5" rx="48" ry="62" fill="#D4FF00" opacity=".5" filter="url(#tip)"/>
    <ellipse cx="512" cy="821.5" rx="50" ry="66" fill="#D4FF00" opacity=".5" filter="url(#tip)"/>
    <!-- inside the gap: deep lime at the walls, the lit body, a pale core -->
    <polygon points="546,193 562,291 574,389 558,491 564,595 540,703 546,813 478,822 472,712 496,604 490,500 506,398 494,300 478,202" fill="#8FB000"/>
    <g clip-path="url(#gp)">
      <path d="M512 197.5 L528 295.5 L540 393.5 L524 495.5 L530 599.5 L506 707.5 L512 817.5" fill="none" stroke="#D4FF00" stroke-width="50" stroke-linejoin="round" filter="url(#soft)"/>
      <path d="M512 197.5 L528 295.5 L540 393.5 L524 495.5 L530 599.5 L506 707.5 L512 817.5" fill="none" stroke="#F6FFD0" stroke-width="28" stroke-linejoin="round" filter="url(#core)"/>
    </g>
    <path d="M512 183.5 L528 295.5 L540 393.5 L524 495.5 L530 599.5 L506 707.5 L512 831.5" fill="none" stroke="#F6FFD0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity=".55" filter="url(#core)"/>
    <!-- the two stone halves -->
    <g transform="translate(-34 0)">
      <polygon points="512,202 528,300 540,398 524,500 530,604 506,712 512,822 202,667 202,357" fill="url(#stone)"/>
      <g clip-path="url(#cL)">
        <polygon points="202,357 512,202 470,470 202,585" fill="rgba(255,255,255,.03)"/><polygon points="202,585 470,470 512,822 202,667" fill="rgba(0,0,0,.04)"/><polygon points="512,202 822,357 822,500 575,455" fill="rgba(255,255,255,.02)"/><polygon points="575,455 822,500 822,667 512,822" fill="rgba(0,0,0,.04)"/>
        <rect x="34" y="0" width="1024" height="1024" filter="url(#grain)" opacity=".07"/>
        <polygon points="512,202 822,357 782,381.7 512,246.7" fill="rgba(163,160,154,.42)"/><polygon points="822,357 822,667 782,642.3 782,381.7" fill="rgba(0,0,0,.30)"/><polygon points="822,667 512,822 512,777.3 782,642.3" fill="rgba(24,24,26,.78)"/><polygon points="512,822 202,667 242,642.3 512,777.3" fill="rgba(24,24,26,.70)"/><polygon points="202,667 202,357 242,381.7 242,642.3" fill="rgba(163,160,154,.16)"/><polygon points="202,357 512,202 512,246.7 242,381.7" fill="rgba(163,160,154,.80)"/>
        <!-- lime spill on the face, gone within ~60 px of the split -->
        <path d="M512 202 L528 300 L540 398 L524 500 L530 604 L506 712 L512 822" fill="none" stroke="#D4FF00" stroke-width="40" stroke-linejoin="round" opacity=".40" filter="url(#spill)"/>
        <!-- the cut face: the stone's thickness, dark, lit by the light from the split -->
        <path d="M512 202 L528 300 L540 398 L524 500 L530 604 L506 712 L512 822" fill="none" stroke="#2B2A27" stroke-width="26" stroke-linejoin="round"/>
        <path d="M512 202 L528 300 L540 398 L524 500 L530 604 L506 712 L512 822" fill="none" stroke="#D4FF00" stroke-width="22" stroke-linejoin="round" opacity=".5" filter="url(#soft)"/>
        <path d="M512 202 L528 300 L540 398 L524 500 L530 604 L506 712 L512 822" fill="none" stroke="#D4FF00" stroke-width="13" stroke-linejoin="round" opacity=".65" filter="url(#soft)"/>
      </g>
    </g>
    <g transform="translate(34 -9)">
      <polygon points="512,202 822,357 822,667 512,822 506,712 530,604 524,500 540,398 528,300" fill="url(#stone)"/>
      <g clip-path="url(#cR)">
        <polygon points="202,357 512,202 470,470 202,585" fill="rgba(255,255,255,.03)"/><polygon points="202,585 470,470 512,822 202,667" fill="rgba(0,0,0,.04)"/><polygon points="512,202 822,357 822,500 575,455" fill="rgba(255,255,255,.02)"/><polygon points="575,455 822,500 822,667 512,822" fill="rgba(0,0,0,.04)"/>
        <rect x="-34" y="9" width="1024" height="1024" filter="url(#grain)" opacity=".07"/>
        <polygon points="512,202 822,357 782,381.7 512,246.7" fill="rgba(163,160,154,.42)"/><polygon points="822,357 822,667 782,642.3 782,381.7" fill="rgba(0,0,0,.30)"/><polygon points="822,667 512,822 512,777.3 782,642.3" fill="rgba(24,24,26,.78)"/><polygon points="512,822 202,667 242,642.3 512,777.3" fill="rgba(24,24,26,.70)"/><polygon points="202,667 202,357 242,381.7 242,642.3" fill="rgba(163,160,154,.16)"/><polygon points="202,357 512,202 512,246.7 242,381.7" fill="rgba(163,160,154,.80)"/>
        <!-- lime spill on the face, gone within ~60 px of the split -->
        <path d="M512 202 L528 300 L540 398 L524 500 L530 604 L506 712 L512 822" fill="none" stroke="#D4FF00" stroke-width="40" stroke-linejoin="round" opacity=".40" filter="url(#spill)"/>
        <!-- the cut face: the stone's thickness, dark, lit by the light from the split -->
        <path d="M512 202 L528 300 L540 398 L524 500 L530 604 L506 712 L512 822" fill="none" stroke="#2B2A27" stroke-width="26" stroke-linejoin="round"/>
        <path d="M512 202 L528 300 L540 398 L524 500 L530 604 L506 712 L512 822" fill="none" stroke="#D4FF00" stroke-width="22" stroke-linejoin="round" opacity=".5" filter="url(#soft)"/>
        <path d="M512 202 L528 300 L540 398 L524 500 L530 604 L506 712 L512 822" fill="none" stroke="#D4FF00" stroke-width="13" stroke-linejoin="round" opacity=".65" filter="url(#soft)"/>
      </g>
    </g>
</svg>
