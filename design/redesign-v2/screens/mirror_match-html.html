<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mirror_match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        :root {
            --background: #000000;
            --cyan: #00E5FF;
            --gold: #FFD700;
            --panel: rgba(255, 255, 255, 0.05);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            margin: 0;
        }
        .iphone-frame {
            width: 393px;
            height: 852px;
            background-color: #000000;
            position: relative;
            border-radius: 0px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
            margin: 2rem auto;
        }
        .glass-panel {
            background: var(--panel);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .label-sm-caps {
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 700;
        }
        .gradient-cyan {
            background: linear-gradient(180deg, #00E5FF 0%, #008899 100%);
        }
        .gradient-gold {
            background: linear-gradient(180deg, #FFD700 0%, #B8860B 100%);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="iphone-frame flex flex-col text-white">
        <!-- #header_001 -->
        <header class="flex-shrink-0 px-6 pt-12 pb-4 z-20">
            <div class="flex justify-between items-center">
                <button class="w-10 h-10 glass-panel rounded-full flex items-center justify-center active:scale-90">
                    <iconify-icon icon="solar:alt-arrow-left-linear" class="text-xl"></iconify-icon>
                </button>
                <div class="text-center">
                    <div class="label-sm-caps text-gray-500 mb-0.5">Social Duel</div>
                    <h1 class="text-xl font-black">Mirror Match</h1>
                </div>
                <button class="w-10 h-10 glass-panel rounded-full flex items-center justify-center active:scale-90">
                    <iconify-icon icon="solar:users-group-two-rounded-bold" class="text-xl"></iconify-icon>
                </button>
            </div>
        </header>
        <!-- /#header_001 -->

        <!-- #scroll-content_002 -->
        <div class="flex-1 overflow-y-auto px-6 py-4">
            <!-- #comparison-visual_003 -->
            <div class="relative mb-8">
                <img src="https://media.screensdesign.com/gasset/a027e3c0af6a4f71aab92191632307e3_screen_image_mirror_match_visual_f540d083ff.png" data-media-ref="generated:138035" alt="Side-by-side comparison of two 3D anatomical characters in Ossa's black mesh style, one with glowing gold upper body and dark legs, the other with glowing cyan legs and dark upper body, dramatic lighting, technical interface markers between them, dark background" class="w-full h-auto rounded-3xl" data-image-aspect="1:1" data-image-background="solid">
                
                <!-- #labels_004 -->
                <div class="absolute top-4 left-4 glass-panel px-3 py-1 rounded-full border-[var(--cyan)]/30">
                    <span class="text-[10px] font-black text-[var(--cyan)]">YOU</span>
                </div>
                <div class="absolute top-4 right-4 glass-panel px-3 py-1 rounded-full border-[var(--gold)]/30">
                    <span class="text-[10px] font-black text-[var(--gold)]">FRIEND</span>
                </div>
            </div>

            <!-- #compatibility-card_005 -->
            <div class="glass-panel rounded-3xl p-6 mb-6 relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-20">
                    <iconify-icon icon="solar:infinity-bold" class="text-4xl text-[var(--gold)]"></iconify-icon>
                </div>
                <div class="label-sm-caps text-gray-400 mb-2">Sync Level</div>
                <div class="flex items-end gap-2 mb-4">
                    <span class="text-4xl font-black text-[var(--gold)]">94%</span>
                    <span class="text-xs font-bold text-gray-500 mb-1.5 uppercase">Compatibility</span>
                </div>
                <div class="p-3 bg-white/5 rounded-xl border border-white/10">
                    <div class="flex items-center gap-2 mb-1">
                        <iconify-icon icon="solar:star-fall-minimalistic-bold" class="text-[var(--cyan)]"></iconify-icon>
                        <span class="text-xs font-bold">Opposite Strength Match</span>
                    </div>
                    <p class="text-[11px] text-gray-400 leading-relaxed">Your Chest peak perfectly offsets their Leg dominance. Training together grants +15% RP efficiency.</p>
                </div>
            </div>

            <!-- #ranks-grid_006 -->
            <div class="grid grid-cols-2 gap-3 mb-10">
                <!-- #user-rank_007 -->
                <div class="glass-panel rounded-2xl p-4">
                    <div class="label-sm-caps text-gray-500 mb-3">Your Peak</div>
                    <div class="flex flex-col gap-1">
                        <span class="text-[var(--cyan)] font-black text-sm uppercase">Strong III</span>
                        <span class="text-lg font-bold">Chest</span>
                    </div>
                </div>
                <!-- #friend-rank_008 -->
                <div class="glass-panel rounded-2xl p-4">
                    <div class="label-sm-caps text-gray-500 mb-3">Friend Peak</div>
                    <div class="flex flex-col gap-1">
                        <span class="text-[var(--gold)] font-black text-sm uppercase">Forged I</span>
                        <span class="text-lg font-bold">Legs</span>
                    </div>
                </div>
            </div>
        </div>
        <!-- /#scroll-content_002 -->

        <!-- #footer_009 -->
        <footer class="flex-shrink-0 px-6 pb-12 pt-4 bg-gradient-to-t from-black to-transparent">
            <button class="w-full py-5 bg-white text-black rounded-3xl font-black uppercase tracking-widest active:scale-95 transition-transform">
                Sync Workout
            </button>
        </footer>
        <!-- /#footer_009 -->
    </div>
</body>
</html>
