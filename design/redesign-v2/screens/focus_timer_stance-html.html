<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>focus_timer_stance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        :root {
            --cyan: #00E5FF;
            --panel: rgba(255, 255, 255, 0.05);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            margin: 0;
        }
        .iphone-frame {
            width: 393px;
            height: 852px;
            background-color: #000000;
            position: relative;
            border-radius: 0px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
            margin: 2rem auto;
        }
        .glass-panel {
            background: var(--panel);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .label-sm-caps {
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 800;
        }
        .glow-cyan {
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.15);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="iphone-frame flex flex-col text-white">
        <!-- #header_001 -->
        <header class="flex-shrink-0 px-6 pt-12 pb-4 z-20 flex justify-between items-center">
            <button class="w-10 h-10 glass-panel rounded-full flex items-center justify-center active:scale-90">
                <iconify-icon icon="solar:alt-arrow-left-linear" class="text-xl"></iconify-icon>
            </button>
            <div class="flex items-center gap-2 bg-[var(--cyan)]/10 px-4 py-2 rounded-full border border-[var(--cyan)]/20">
                <div class="w-2 h-2 rounded-full bg-[var(--cyan)] animate-pulse"></div>
                <span class="text-[10px] font-black uppercase tracking-widest text-[var(--cyan)]">Deep Work Active</span>
            </div>
            <button class="w-10 h-10 glass-panel rounded-full flex items-center justify-center">
                <iconify-icon icon="solar:tuning-bold" class="text-xl"></iconify-icon>
            </button>
        </header>
        <!-- /#header_001 -->

        <!-- #scroll-content_002 -->
        <div class="flex-1 overflow-y-auto px-6">
            <!-- #timer_003 -->
            <div class="text-center mt-8 mb-6">
                <h1 class="text-[84px] font-black tracking-tighter leading-none">25:00</h1>
                <div class="label-sm-caps text-gray-500 mt-2">Session Remainder</div>
            </div>

            <!-- #meditation-visual_004 -->
            <div class="relative flex justify-center py-4 mb-8">
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 bg-[var(--cyan)]/10 blur-[80px] rounded-full"></div>
                <img src="https://media.screensdesign.com/gasset/f2d6ae4256054b269f688ef67e2e0f5c_screen_image_deep_work_pose_4a8b3fdd93.png" data-media-ref="generated:138038" alt="3D anatomical character in a cross-legged meditative seated pose, black mesh material with a glowing cyan focus aura in the chest and head, minimalist dark space, serene and powerful aesthetic" class="w-[85%] h-auto z-10 drop-shadow-[0_0_20px_rgba(0,229,255,0.3)]" data-image-aspect="1:1" data-image-background="transparent">
            </div>

            <!-- #stats_005 -->
            <div class="grid grid-cols-2 gap-3 mb-12">
                <div class="glass-panel p-5 rounded-[32px] flex flex-col items-center">
                    <div class="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center mb-3">
                        <iconify-icon icon="solar:fire-bold" class="text-xl text-orange-500"></iconify-icon>
                    </div>
                    <div class="text-lg font-black">4 Days</div>
                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Streak</div>
                </div>
                <div class="glass-panel p-5 rounded-[32px] flex flex-col items-center">
                    <div class="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center mb-3">
                        <iconify-icon icon="solar:crown-minimalistic-bold" class="text-xl text-[var(--cyan)]"></iconify-icon>
                    </div>
                    <div class="text-lg font-black">880 XP</div>
                    <div class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Aura Score</div>
                </div>
            </div>
        </div>
        <!-- /#scroll-content_002 -->

        <!-- #footer_006 -->
        <footer class="flex-shrink-0 px-6 pb-12 pt-4 bg-black flex flex-col gap-4">
            <div class="flex justify-between items-center px-2">
                <span class="text-xs font-bold text-gray-400">Silent Notifications</span>
                <div class="w-12 h-6 bg-[var(--cyan)]/20 rounded-full p-1 flex justify-end items-center border border-[var(--cyan)]/40">
                    <div class="w-4 h-4 bg-[var(--cyan)] rounded-full shadow-[0_0_10px_var(--cyan)]"></div>
                </div>
            </div>
            <button class="w-full py-5 bg-white text-black rounded-[28px] font-black uppercase tracking-[0.2em] active:scale-95 transition-transform">
                End Session
            </button>
        </footer>
        <!-- /#footer_006 -->
    </div>
</body>
</html>
