<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>focus_aura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        :root {
            --background: #000000;
            --card-bg: #121212;
            --accent-cyan: #00E5FF;
            --accent-lime: #D4FF00;
            --text-muted: #8E8E93;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-h-screen;
        }
        .iphone-frame {
            width: 393px;
            height: 852px;
            background-color: #000000;
            position: relative;
            border-radius: 0px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
            margin: 2rem auto;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .label-sm-caps {
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 700;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="iphone-frame flex flex-col text-white">
        <!-- #header_001 -->
        <header class="flex-shrink-0 px-6 pt-12 pb-4 z-20">
            <div class="flex justify-between items-center mb-6">
                <button class="w-10 h-10 glass-panel rounded-full flex items-center justify-center active:scale-95">
                    <iconify-icon icon="solar:alt-arrow-left-linear" class="text-xl"></iconify-icon>
                </button>
                <div class="label-sm-caps text-[var(--accent-cyan)]">Neural State</div>
                <button class="w-10 h-10 glass-panel rounded-full flex items-center justify-center active:scale-95">
                    <iconify-icon icon="solar:settings-bold" class="text-xl"></iconify-icon>
                </button>
            </div>
            <div>
                <h1 class="text-3xl font-black tracking-tight mb-2">Mental Clarity</h1>
                <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
                    <!-- #clarity-progress_002 -->
                    <div class="w-[68%] h-full bg-[var(--accent-cyan)] shadow-[0_0_10px_var(--accent-cyan)]"></div>
                    <!-- /#clarity-progress_002 -->
                </div>
                <div class="flex justify-between mt-2">
                    <span class="text-[10px] font-bold text-gray-500">LVL 14 AURA</span>
                    <span class="text-[10px] font-bold text-gray-500">320 XP TO LVL 15</span>
                </div>
            </div>
        </header>
        <!-- /#header_001 -->

        <!-- #scroll-content_003 -->
        <div class="flex-1 overflow-y-auto px-6">
            <!-- #main-visual_004 -->
            <div class="relative py-4 flex justify-center">
                <img src="https://media.screensdesign.com/gasset/b7cbf0703fec42f7ba0bac9d2856bc93_screen_image_focus_aura_visual_e0bbc714a8.png" data-media-ref="generated:138025" alt="Close-up of a 3D anatomical head, black mesh material, surrounded by a glowing cyan and white crystalline focus aura, ethereal energy field, dramatic lighting, minimalist dark aesthetic, 8k resolution" class="w-full aspect-square object-contain" data-image-aspect="1:1" data-image-background="transparent">
                <div class="absolute bottom-10 left-1/2 -translate-x-1/2 glass-panel px-4 py-2 rounded-full">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-[var(--accent-cyan)] animate-pulse"></div>
                        <span class="text-xs font-bold tracking-tight">CRYSTALLINE SYNCED</span>
                    </div>
                </div>
            </div>
            <!-- /#main-visual_004 -->

            <!-- #sessions-list_005 -->
            <div class="space-y-4 pb-10">
                <div class="label-sm-caps text-gray-500">GROW YOUR AURA</div>
                
                <!-- #session-box-breathing_006 -->
                <div class="glass-panel rounded-2xl p-4 flex items-center justify-between active:scale-[0.98] transition-transform">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-[var(--accent-cyan)]/10 rounded-xl flex items-center justify-center border border-[var(--accent-cyan)]/20">
                            <iconify-icon icon="solar:wind-bold" class="text-2xl text-[var(--accent-cyan)]"></iconify-icon>
                        </div>
                        <div>
                            <h3 class="font-bold">Box Breathing</h3>
                            <p class="text-xs text-gray-500">4-4-4-4 Tempo • 5 mins</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs font-black text-[var(--accent-cyan)]">+12 XP</div>
                        <iconify-icon icon="solar:alt-arrow-right-linear" class="text-gray-600 mt-1"></iconify-icon>
                    </div>
                </div>
                <!-- /#session-box-breathing_006 -->

                <!-- #session-stoic-focus_007 -->
                <div class="glass-panel rounded-2xl p-4 flex items-center justify-between active:scale-[0.98] transition-transform">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-white/5 rounded-xl flex items-center justify-center border border-white/10">
                            <iconify-icon icon="solar:shield-star-bold" class="text-2xl text-white"></iconify-icon>
                        </div>
                        <div>
                            <h3 class="font-bold">Stoic Focus</h3>
                            <p class="text-xs text-gray-500">Meditation • 10 mins</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs font-black text-[var(--accent-cyan)]">+25 XP</div>
                        <iconify-icon icon="solar:alt-arrow-right-linear" class="text-gray-600 mt-1"></iconify-icon>
                    </div>
                </div>
                <!-- /#session-stoic-focus_007 -->

                <!-- #session-deep-work_008 -->
                <div class="glass-panel rounded-2xl p-4 flex items-center justify-between opacity-60">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-white/5 rounded-xl flex items-center justify-center">
                            <iconify-icon icon="solar:lock-bold" class="text-2xl text-gray-500"></iconify-icon>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-400">Zen Flow</h3>
                            <p class="text-xs text-gray-600">Unlocks at Lvl 15</p>
                        </div>
                    </div>
                </div>
                <!-- /#session-deep-work_008 -->
            </div>
            <!-- /#sessions-list_005 -->
        </div>
        <!-- /#scroll-content_003 -->

        <!-- #footer_009 -->
        <footer class="flex-shrink-0 bg-black/80 backdrop-blur-xl border-t border-white/5 pb-8 pt-4 px-6">
            <div class="flex justify-between items-center">
                <div class="flex flex-col items-center gap-1 opacity-40">
                    <iconify-icon icon="solar:accessibility-bold" class="text-2xl"></iconify-icon>
                    <span class="text-[10px] font-bold">Body</span>
                </div>
                <div class="flex flex-col items-center gap-1 opacity-40">
                    <iconify-icon icon="solar:dumbbell-bold" class="text-2xl"></iconify-icon>
                    <span class="text-[10px] font-bold">Train</span>
                </div>
                <div class="flex flex-col items-center gap-1 relative">
                    <div class="absolute -top-1 right-0 w-1.5 h-1.5 bg-[var(--accent-cyan)] rounded-full"></div>
                    <iconify-icon icon="solar:wind-bold" class="text-2xl text-[var(--accent-cyan)]"></iconify-icon>
                    <span class="text-[10px] font-bold text-[var(--accent-cyan)]">Focus</span>
                </div>
                <div class="flex flex-col items-center gap-1 opacity-40">
                    <iconify-icon icon="solar:moon-sleep-bold" class="text-2xl"></iconify-icon>
                    <span class="text-[10px] font-bold">Recover</span>
                </div>
                <div class="flex flex-col items-center gap-1 opacity-40">
                    <iconify-icon icon="solar:book-bookmark-bold" class="text-2xl"></iconify-icon>
                    <span class="text-[10px] font-bold">Learn</span>
                </div>
            </div>
        </footer>
        <!-- /#footer_009 -->
    </div>
</body>
</html>
