<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        :root {
            --primary: #D4FF00;
            --cyan: #00E5FF;
            --gold: #FFD700;
            --neglected: #FF4D4D;
            --background: #000000;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: white;
        }
        .iphone-frame {
            width: 393px;
            height: 852px;
            background-color: var(--background);
            position: relative;
            border-radius: 0px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
            margin: 2rem auto;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .label-sm-caps {
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 700;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="iphone-frame flex flex-col">
        <!-- #header_001 -->
        <header class="flex-shrink-0 px-6 pt-12 pb-4 z-20">
            <div class="flex justify-between items-center mb-6">
                <button class="w-10 h-10 glass-panel rounded-xl flex items-center justify-center active:scale-95 transition-transform">
                    <iconify-icon icon="solar:alt-arrow-left-linear" class="text-xl"></iconify-icon>
                </button>
                <h1 class="text-xl font-black uppercase tracking-tight">Discovery</h1>
                <button class="w-10 h-10 glass-panel rounded-xl flex items-center justify-center active:scale-95 transition-transform">
                    <iconify-icon icon="solar:filter-bold" class="text-xl"></iconify-icon>
                </button>
            </div>

            <!-- #search-bar_002 -->
            <div class="relative mb-6">
                <iconify-icon icon="solar:magnifer-linear" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-lg"></iconify-icon>
                <input type="text" placeholder="Search movements..." class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-sm font-medium focus:outline-none focus:border-[var(--primary)]/50 transition-colors">
            </div>

            <!-- #categories_003 -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2">
                <button class="bg-[var(--primary)] text-black px-5 py-2 rounded-full text-xs font-black whitespace-nowrap">All</button>
                <button class="glass-panel text-white px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap">Compound</button>
                <button class="glass-panel text-white px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap">Isolation</button>
                <button class="glass-panel text-white px-5 py-2 rounded-full text-xs font-bold whitespace-nowrap">Mobility</button>
            </div>
        </header>

        <!-- #scroll-content_004 -->
        <div class="flex-1 overflow-y-auto px-6 py-4 no-scrollbar">
            <!-- #neglected-section_005 -->
            <div class="mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="label-sm-caps text-gray-500">Recommended Lifts</h2>
                    <span class="text-[9px] font-black bg-[var(--neglected)]/20 text-[var(--neglected)] px-2 py-0.5 rounded">LOW VITALITY</span>
                </div>
                <div class="grid grid-cols-1 gap-4">
                    <!-- #exercise-card-neglected_006 -->
                    <div class="glass-panel rounded-2xl p-4 flex items-center gap-4 border-l-4 border-l-[var(--neglected)] relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-[var(--neglected)] opacity-[0.03] blur-3xl pointer-events-none"></div>
                        <div class="w-16 h-16 bg-white/5 rounded-xl flex items-center justify-center border border-white/10">
                            <iconify-icon icon="solar:dumbbell-large-minimalistic-bold" class="text-3xl text-[var(--neglected)]"></iconify-icon>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="label-sm-caps text-[var(--neglected)]">Neglected</span>
                                <span class="w-1 h-1 rounded-full bg-gray-600"></span>
                                <span class="text-[10px] font-bold text-gray-500">LOWER BACK</span>
                            </div>
                            <h3 class="text-lg font-black leading-tight">Conventional Deadlift</h3>
                            <div class="flex items-center gap-2 mt-1">
                                <iconify-icon icon="solar:graph-up-bold" class="text-[var(--primary)] text-xs"></iconify-icon>
                                <span class="text-xs font-bold text-gray-400">+45 RP Potential</span>
                            </div>
                        </div>
                        <iconify-icon icon="solar:add-circle-bold" class="text-2xl text-[var(--primary)]"></iconify-icon>
                    </div>
                </div>
            </div>

            <!-- #regular-discovery_007 -->
            <div class="mb-8">
                <h2 class="label-sm-caps text-gray-500 mb-4">Muscle Groups</h2>
                <div class="grid grid-cols-2 gap-3">
                    <!-- #muscle-group-1_008 -->
                    <div class="glass-panel rounded-2xl p-4 aspect-square flex flex-col justify-between active:scale-95 transition-transform">
                        <iconify-icon icon="solar:user-bold" class="text-2xl text-[var(--cyan)]"></iconify-icon>
                        <div>
                            <div class="text-xl font-black">Chest</div>
                            <div class="text-[10px] font-bold text-gray-500">12 Movements</div>
                        </div>
                    </div>
                    <!-- #muscle-group-2_009 -->
                    <div class="glass-panel rounded-2xl p-4 aspect-square flex flex-col justify-between active:scale-95 transition-transform">
                        <iconify-icon icon="solar:walking-bold" class="text-2xl text-[var(--gold)]"></iconify-icon>
                        <div>
                            <div class="text-xl font-black">Legs</div>
                            <div class="text-[10px] font-bold text-gray-500">24 Movements</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- #all-movements_010 -->
            <div>
                <h2 class="label-sm-caps text-gray-500 mb-4">All Movements</h2>
                <div class="flex flex-col gap-3 pb-8">
                    <div class="glass-panel rounded-2xl p-4 flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-white/5 rounded-xl flex items-center justify-center">
                                <iconify-icon icon="solar:dumbbells-bold" class="text-xl text-gray-400"></iconify-icon>
                            </div>
                            <div>
                                <div class="text-sm font-bold">Barbell Bench Press</div>
                                <div class="text-[10px] font-bold text-gray-500 uppercase">Chest · Compound</div>
                            </div>
                        </div>
                        <iconify-icon icon="solar:alt-arrow-right-linear" class="text-gray-600"></iconify-icon>
                    </div>
                    <div class="glass-panel rounded-2xl p-4 flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-white/5 rounded-xl flex items-center justify-center">
                                <iconify-icon icon="solar:dumbbells-bold" class="text-xl text-gray-400"></iconify-icon>
                            </div>
                            <div>
                                <div class="text-sm font-bold">Lateral Raise</div>
                                <div class="text-[10px] font-bold text-gray-500 uppercase">Shoulders · Isolation</div>
                            </div>
                        </div>
                        <iconify-icon icon="solar:alt-arrow-right-linear" class="text-gray-600"></iconify-icon>
                    </div>
                </div>
            </div>
        </div>

        <!-- #footer_011 -->
        <footer class="flex-shrink-0 bg-black/80 backdrop-blur-xl border-t border-white/5 pb-8 pt-4 px-6">
            <div class="flex justify-between items-center">
                <div class="flex flex-col items-center gap-1 opacity-40">
                    <iconify-icon icon="solar:accessibility-bold" class="text-2xl"></iconify-icon>
                    <span class="text-[10px] font-bold">Body</span>
                </div>
                <div class="flex flex-col items-center gap-1">
                    <iconify-icon icon="solar:dumbbell-bold" class="text-2xl text-[var(--primary)]"></iconify-icon>
                    <span class="text-[10px] font-bold text-[var(--primary)]">Train</span>
                </div>
                <div class="flex flex-col items-center gap-1 opacity-40">
                    <iconify-icon icon="solar:wind-bold" class="text-2xl"></iconify-icon>
                    <span class="text-[10px] font-bold">Breathe</span>
                </div>
                <div class="flex flex-col items-center gap-1 opacity-40">
                    <iconify-icon icon="solar:moon-sleep-bold" class="text-2xl"></iconify-icon>
                    <span class="text-[10px] font-bold">Recover</span>
                </div>
                <div class="flex flex-col items-center gap-1 opacity-40">
                    <iconify-icon icon="solar:book-bookmark-bold" class="text-2xl"></iconify-icon>
                    <span class="text-[10px] font-bold">Learn</span>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
