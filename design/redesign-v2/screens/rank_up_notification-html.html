<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        :root {
            --primary: #D4FF00;
            --strong: #FFFFFF;
            --forged: #FFD700;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
        }
        .iphone-frame {
            width: 393px;
            height: 852px;
            background-color: #000000;
            position: relative;
            border-radius: 0px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
            margin: 2rem auto;
        }
        .hexagon-badge {
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: white;
            width: 160px;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .rank-rays {
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="iphone-frame flex flex-col text-white">
        <!-- #header_001 -->
        <header class="flex-shrink-0 p-6 pt-12 flex flex-col items-center">
            <div class="w-full flex items-center justify-center gap-2 mb-8">
                <iconify-icon icon="solar:double-alt-arrow-up-bold-duotone" class="text-xs"></iconify-icon>
                <span class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-400">Rank Up · 1 of 2</span>
            </div>
        </header>

        <!-- #scroll-content_002 -->
        <div class="flex-1 flex flex-col items-center justify-center relative overflow-hidden">
            <!-- #celebration-background_003 -->
            <div class="absolute inset-0 z-0 flex items-center justify-center">
                <div class="rank-rays w-[500px] h-[500px] absolute"></div>
                <div class="flex gap-4 opacity-10 absolute rotate-45">
                    <div class="w-1 h-[800px] bg-white"></div>
                    <div class="w-1 h-[800px] bg-white"></div>
                    <div class="w-1 h-[800px] bg-white"></div>
                </div>
            </div>

            <!-- #rank-badge_004 -->
            <div class="relative z-10 flex flex-col items-center">
                <div class="hexagon-badge mb-12 shadow-[0_0_60px_rgba(255,255,255,0.4)]">
                    <div class="text-black font-black text-6xl tracking-tighter">III</div>
                    <div class="text-black font-black text-[10px] uppercase tracking-widest mt-2">Strong</div>
                </div>

                <h2 class="text-5xl font-black tracking-tight mb-2 uppercase italic shadow-black drop-shadow-2xl">Strong III</h2>
                <p class="text-2xl font-bold text-white/90 mb-4">Glutes ranked up</p>
                <div class="flex items-center gap-3 text-sm font-bold text-gray-500">
                    <span>Strong II</span>
                    <iconify-icon icon="solar:alt-arrow-right-linear"></iconify-icon>
                    <span class="text-white">Strong III</span>
                </div>
            </div>

            <!-- #progress-line_005 -->
            <div class="w-full px-12 mt-12 mb-12 relative z-10">
                <div class="w-full h-1 bg-white/10 rounded-full overflow-hidden">
                    <div class="w-1/3 h-full bg-white"></div>
                </div>
                <div class="flex justify-between items-center mt-3">
                    <span class="text-[10px] font-black text-[var(--primary)]">+3 RP</span>
                    <span class="text-[10px] font-black text-gray-500 uppercase tracking-widest">6 to Forged I</span>
                </div>
            </div>

            <!-- #stats-grid_006 -->
            <div class="grid grid-cols-3 gap-3 px-6 w-full relative z-10">
                <div class="bg-white/5 border border-white/10 rounded-2xl p-4 flex flex-col items-center">
                    <div class="text-lg font-black">100×11</div>
                    <div class="text-[8px] font-bold text-gray-500 uppercase tracking-widest mt-1 text-center">Best set</div>
                </div>
                <div class="bg-white/5 border border-white/10 rounded-2xl p-4 flex flex-col items-center">
                    <div class="text-lg font-black">137 kg</div>
                    <div class="text-[8px] font-bold text-gray-500 uppercase tracking-widest mt-1 text-center">Est. 1-rep max</div>
                </div>
                <div class="bg-white/5 border border-white/10 rounded-2xl p-4 flex flex-col items-center">
                    <div class="text-lg font-black text-[var(--primary)]">+3 RP</div>
                    <div class="text-[8px] font-bold text-gray-500 uppercase tracking-widest mt-1 text-center">This session</div>
                </div>
            </div>
        </div>

        <!-- #footer_007 -->
        <footer class="flex-shrink-0 p-6 pb-12 flex flex-col items-center gap-6">
            <button class="w-full h-16 bg-[#F5F2EB] text-black rounded-3xl font-black text-xl active:scale-95 transition-transform">
                Next
            </button>
            <button class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-500 active:opacity-60">
                See all your ranks
            </button>
        </footer>
    </div>
</body>
</html>
