<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        :root {
            --primary: #D4FF00;
            --cyan: #00E5FF;
            --background: #000000;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: white;
        }
        .iphone-frame {
            width: 393px;
            height: 852px;
            background-color: var(--background);
            position: relative;
            border-radius: 0px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
            margin: 2rem auto;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .label-sm-caps {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 800;
        }
        .monk-glow {
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="iphone-frame flex flex-col">
        <!-- #header_001 -->
        <header class="flex-shrink-0 px-6 pt-12 pb-2 z-20 flex justify-between items-center">
            <button class="w-10 h-10 glass-panel rounded-full flex items-center justify-center">
                <iconify-icon icon="solar:close-circle-bold" class="text-2xl text-gray-500"></iconify-icon>
            </button>
            <div class="label-sm-caps text-[var(--cyan)]">Initiate Protocol</div>
            <div class="w-10"></div>
        </header>

        <!-- #scroll-content_002 -->
        <div class="flex-1 overflow-y-auto px-6 relative flex flex-col items-center">
            <!-- #hero-visual_003 -->
            <div class="relative w-full aspect-square flex items-center justify-center mb-4">
                <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent z-10"></div>
                <img src="https://media.screensdesign.com/gasset/3d86190863e24e3fb4c6b0c9a4848897_screen_image_monk_mode_hero_a3bc6d5475.png" data-media-ref="generated:138040" alt="A 3D anatomical character in an intense, powerful standing pose, pitch black mesh material with a concentrated, sharp neon cyan focus aura emanating from the core, dark minimalist background, cinematic lighting" class="w-full h-full object-contain" data-image-aspect="1:1" data-image-background="transparent">
            </div>

            <div class="text-center mb-8 relative z-10">
                <h1 class="text-5xl font-black tracking-tighter mb-2 italic">MONK MODE</h1>
                <p class="text-sm text-gray-400 font-medium px-4">Deep physical presence. Zero distractions. Unbreakable focus.</p>
            </div>

            <!-- #duration-presets_004 -->
            <div class="w-full grid grid-cols-3 gap-3 mb-10">
                <button class="glass-panel py-4 rounded-2xl flex flex-col items-center border-[var(--cyan)]/30">
                    <span class="text-2xl font-black text-[var(--cyan)]">25</span>
                    <span class="label-sm-caps text-xs opacity-60">MIN</span>
                </button>
                <button class="bg-white text-black py-4 rounded-2xl flex flex-col items-center shadow-lg active:scale-95 transition-transform">
                    <span class="text-2xl font-black">50</span>
                    <span class="label-sm-caps text-xs opacity-60">MIN</span>
                </button>
                <button class="glass-panel py-4 rounded-2xl flex flex-col items-center opacity-40">
                    <span class="text-2xl font-black">90</span>
                    <span class="label-sm-caps text-xs opacity-60">MIN</span>
                </button>
            </div>

            <!-- #rules-summary_005 -->
            <div class="w-full glass-panel rounded-2xl p-6 mb-12">
                <h3 class="label-sm-caps text-gray-500 mb-4">The Three Pillars</h3>
                <div class="flex flex-col gap-4">
                    <div class="flex items-center gap-4">
                        <div class="w-8 h-8 rounded-lg bg-[var(--cyan)]/10 flex items-center justify-center">
                            <iconify-icon icon="solar:bell-off-bold" class="text-[var(--cyan)]"></iconify-icon>
                        </div>
                        <div class="text-sm font-bold">No Notifications</div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="w-8 h-8 rounded-lg bg-[var(--cyan)]/10 flex items-center justify-center">
                            <iconify-icon icon="solar:lock-bold" class="text-[var(--cyan)]"></iconify-icon>
                        </div>
                        <div class="text-sm font-bold">Character Locked</div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="w-8 h-8 rounded-lg bg-[var(--cyan)]/10 flex items-center justify-center">
                            <iconify-icon icon="solar:eye-bold" class="text-[var(--cyan)]"></iconify-icon>
                        </div>
                        <div class="text-sm font-bold">Deep Focus Only</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- #footer_006 -->
        <footer class="flex-shrink-0 p-6 pb-12">
            <button class="w-full h-16 bg-[var(--cyan)] text-black rounded-3xl font-black text-xl active:scale-95 transition-transform monk-glow">
                START MONK MODE
            </button>
        </footer>
    </div>
</body>
</html>
